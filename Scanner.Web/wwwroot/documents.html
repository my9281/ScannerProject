<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作文档</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#172b3a;font:16px/1.5 system-ui,sans-serif}header{padding:16px 24px;background:#12344b;color:white;display:flex;gap:20px;align-items:center}header a{color:#c5e7ff}h1{font-size:22px;margin:0}main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;height:calc(100dvh - 66px)}nav{background:white;border-radius:10px;overflow:auto;padding:16px}nav h2{font-size:15px;color:#536a79}nav a{display:block;color:#12638e;padding:10px;text-decoration:none;border-radius:6px}nav a:hover,nav a[aria-current]{background:#e4f2fa}iframe{width:100%;height:100%;border:0;background:white;border-radius:10px}#status{padding:0 24px;color:#ac3030}button{border:0;padding:8px 12px;border-radius:6px;cursor:pointer}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:180px 1fr;height:calc(100dvh - 100px)}header{padding:12px;flex-wrap:wrap}nav{padding:8px}nav a{padding:6px}}
</style></head><body><header><h1>操作文档</h1><a href="/account.html">返回账户</a><button id="refresh">刷新目录</button></header><p id="status" role="status"></p><main><nav id="list" aria-label="文档目录"></nav><iframe id="reader" title="文档内容" sandbox="allow-same-origin"></iframe></main>
<script>
const token=sessionStorage.getItem('accountToken')||'',status=document.querySelector('#status'),reader=document.querySelector('#reader'),list=document.querySelector('#list');
if(!token)location.replace('/login.html');
async function request(url){const response=await fetch(url,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});if(response.status===401){sessionStorage.removeItem('accountToken');location.replace('/login.html');throw Error('请重新登录')}if(!response.ok){const error=await response.json().catch(()=>({}));throw Error(error.message||`请求失败（${response.status}）`)}return response}
let activePath='',generation=0;
async function show(path){const current=++generation;status.textContent='正在加载文档……';try{const result=await(await request('/api/documents/render?path='+encodeURIComponent(path))).json();if(current!==generation)return;activePath=path;reader.srcdoc=result.html;history.replaceState(null,'','?path='+encodeURIComponent(path));for(const a of list.querySelectorAll('a')){if(a.dataset.path===path)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}status.textContent=''}catch(error){if(current===generation){reader.srcdoc='';status.textContent=error.message}}}
reader.addEventListener('load',()=>{reader.contentDocument?.addEventListener('click',async event=>{const a=event.target.closest('a');if(!a)return;event.preventDefault();const url=new URL(a.getAttribute('href'),location.origin);try{if(url.origin===location.origin&&url.pathname==='/documents.html'){await show(url.searchParams.get('path')||'README.md')}else if(url.origin===location.origin&&url.pathname==='/api/documents/file'){const response=await request(url.pathname+url.search),blob=await response.blob(),objectUrl=URL.createObjectURL(blob),download=document.createElement('a');download.href=objectUrl;download.download=(url.searchParams.get('path')||'附件').split('/').pop();download.click();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000)}else if(a.getAttribute('href').startsWith('#')){reader.contentDocument.getElementById(decodeURIComponent(url.hash.slice(1)))?.scrollIntoView()}else if(url.protocol==='https:'){window.open(url.href,'_blank','noopener,noreferrer')}}catch(error){status.textContent=error.message}})});
async function load(){status.textContent='正在加载目录……';try{const entries=await(await request('/api/documents')).json();list.replaceChildren();let section='';for(const entry of entries){if(entry.section!==section){section=entry.section;const h=document.createElement('h2');h.textContent=section;list.append(h)}const a=document.createElement('a');a.textContent=entry.title;a.href='?path='+encodeURIComponent(entry.path);a.dataset.path=entry.path;a.addEventListener('click',event=>{event.preventDefault();show(entry.path)});list.append(a)}if(!entries.length){reader.srcdoc='';status.textContent='暂无文档，请联系管理员确认服务端已发布文档资源。';return}await show(activePath||new URLSearchParams(location.search).get('path')||'sop/README.md')}catch(error){status.textContent=error.message}}
document.querySelector('#refresh').addEventListener('click',load);if(token)load();
</script></body></html>
