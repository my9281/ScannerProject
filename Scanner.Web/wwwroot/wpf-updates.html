<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPF 更新发布</title><link rel="stylesheet" href="/account.css">
<style>.card{max-width:680px}input[type=file]{display:block;margin:20px 0;width:100%}progress{width:100%;margin:12px 0}dl{overflow-wrap:anywhere}a{color:#185878}.actions{display:flex;gap:16px;margin-top:20px}button:disabled{opacity:.6}</style></head>
<body><main class="card"><h1>WPF 更新发布</h1><p class="sub">上传发布脚本生成的 ZIP，系统读取程序版本并发布更新。仅管理员可操作。</p>
<dl class="profile"><dt>当前版本</dt><dd id="version">读取中…</dd><dt>更新包</dt><dd id="package">—</dd></dl>
<form id="upload"><label for="file">选择 WPF 更新包（ZIP，最大 512 MB）</label><input id="file" type="file" accept=".zip,application/zip" required disabled><button id="publish" type="submit" disabled>上传并发布</button></form>
<progress id="progress" max="100" value="0" hidden></progress><p id="message" class="message" role="status" aria-live="polite"></p>
<div class="actions"><a href="/account.html">返回账户</a><a href="/updates/wpf/latest.json" target="_blank" rel="noopener">查看版本清单</a></div></main>
<script>
const token=sessionStorage.getItem('accountToken')||'',message=document.querySelector('#message'),file=document.querySelector('#file'),button=document.querySelector('#publish'),progress=document.querySelector('#progress');
let authorized=false;
function notify(text,error=false){message.textContent=text;message.className='message'+(error?' error':'')}
async function latest(){const response=await fetch('/updates/wpf/latest.json',{cache:'no-store'});if(response.status===404){document.querySelector('#version').textContent='尚未发布';document.querySelector('#package').textContent='—';return}if(!response.ok)throw new Error('当前版本读取失败');const data=await response.json();document.querySelector('#version').textContent=data.version;const link=document.createElement('a');link.href=data.packageUrl;link.textContent='下载当前更新包';document.querySelector('#package').replaceChildren(link)}
async function load(){if(!token){location.replace('/login.html');return}try{const response=await fetch('/api/account/me',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});if(response.status===401){sessionStorage.removeItem('accountToken');location.replace('/login.html');return}if(!response.ok)throw new Error('账户验证失败');const user=await response.json();authorized=(user.permissions||[]).includes('system.configure');if(!authorized){notify('当前账户没有发布权限，请使用管理员账户登录。',true);return}file.disabled=false;button.disabled=false;await latest()}catch(error){notify(error.message,true)}}load();
document.querySelector('#upload').addEventListener('submit',event=>{event.preventDefault();if(!authorized||!file.files.length)return;const selected=file.files[0];if(!selected.name.toLowerCase().endsWith('.zip')||selected.size===0||selected.size>512*1024*1024){notify('请选择有效 ZIP 更新包，大小不能超过 512 MB。',true);return}const body=new FormData();body.append('file',selected);button.disabled=true;file.disabled=true;progress.hidden=false;progress.value=0;notify('正在上传更新包…');const request=new XMLHttpRequest();request.open('POST','/api/updates/wpf');request.setRequestHeader('Authorization',`Bearer ${token}`);request.timeout=600000;request.upload.onprogress=e=>{if(e.lengthComputable){progress.value=e.loaded/e.total*100;if(e.loaded===e.total)notify('上传完成，正在校验并发布…')}};const done=()=>{button.disabled=false;file.disabled=false;progress.hidden=true};request.onload=async()=>{done();let result={};try{result=JSON.parse(request.responseText)}catch{}if(request.status>=200&&request.status<300){notify(result.message||'发布成功');file.value='';try{await latest()}catch(error){notify('发布成功；'+error.message,true)}}else{const extra=request.status===413?'更新包过大，请检查服务器及反向代理的上传限制。':'发布失败（HTTP '+request.status+'）';notify(result.message||extra,true)}};request.onerror=()=>{done();notify('网络连接失败，更新状态未确认，请刷新当前版本后再操作。',true)};request.ontimeout=()=>{done();notify('请求超时，更新状态未确认，请刷新当前版本后再操作。',true)};request.send(body)});
</script></body></html>
