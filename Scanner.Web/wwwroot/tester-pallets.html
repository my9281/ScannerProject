<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>扫描托盘数据</title>
  <style>
    :root{font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{width:min(1000px,calc(100% - 28px));margin:28px auto}a{color:#2457d6}header{background:#173a70;color:white;padding:24px;border-radius:16px}h1{margin:0 0 12px}header p{margin:0;line-height:1.7}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:6px;font-size:14px}input,button{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:10px}button{background:#2457d6;color:white;cursor:pointer}button:disabled{opacity:.5}details{background:white;border:1px solid #dfe6f0;border-radius:12px;margin-bottom:12px;overflow:hidden}summary{padding:18px;cursor:pointer;font-weight:700}summary span{font-weight:400;color:#596579;margin-left:18px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:12px 18px;text-align:left;border-top:1px solid #edf0f5;white-space:nowrap}th{background:#f7f9fc;color:#596579}td.sn{white-space:pre-wrap;overflow-wrap:anywhere;min-width:180px}#message{min-height:24px;color:#596579}.error{color:#b02b2b!important}.back{display:inline-block;margin-bottom:16px}@media(max-width:600px){.shell{margin:16px auto}header{padding:20px}summary span{margin-left:8px}td,th{padding:10px}}
  </style>
</head>
<body><main class="shell">
  <a class="back" href="/account.html">← 返回我的账户</a>
  <header><h1>扫描托盘数据</h1><p>按托盘号分组查看当前未归档的扫描记录，点击托盘展开 SN 明细。</p></header>
  <form id="filters"><label>托盘号<input id="pallet" type="number" min="1" max="100" step="1" placeholder="全部托盘"></label><label>SN 搜索<input id="search" type="search" placeholder="输入完整或部分 SN"></label><button type="submit">查询</button><button id="refresh" type="button">刷新数据</button></form>
  <p id="message" role="status" aria-live="polite"></p><section id="groups" aria-label="托盘列表"></section>
</main><script src="/tester-pallets.js"></script></body>
</html>
