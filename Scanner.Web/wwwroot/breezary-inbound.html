<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BreezaryStar · 扫码入库记录</title><link rel="stylesheet" href="/account.css">
<style>.card{max-width:1200px;width:calc(100% - 48px)}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}button{width:auto;padding:10px 18px}.table-wrap{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #dce4ed;white-space:pre-wrap;overflow-wrap:anywhere}th{white-space:nowrap;background:#f4f7fa;position:sticky;top:0}#search{flex:1;min-width:180px}button:disabled{opacity:.5}</style></head><body><main class="card">
<h1>BreezaryStar · 扫码入库记录</h1><p class="sub">查看 AndroidScanner 上传的全部原始扫描记录。相同条码的多次扫描逐条保留。</p>
<form id="filters" class="filters"><select id="location" aria-label="缓存位置"><option value="">全部位置</option></select><input id="search" aria-label="扫描内容搜索" maxlength="200" placeholder="搜索扫描内容"><button type="submit">查询 / 刷新</button></form>
<p id="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>缓存位置</th><th>扫描内容</th><th>扫描时间</th><th>上传时间</th><th>设备 ID</th><th>记录 ID</th></tr></thead><tbody id="records"></tbody></table></div>
<button id="more" disabled>加载更多</button><p><a href="/account.html">返回账户</a></p></main><script src="/breezary-inbound.js"></script></body></html>
