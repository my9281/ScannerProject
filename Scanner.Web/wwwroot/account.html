<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的账户</title><link rel="stylesheet" href="/account.css"></head><body><main class="card"><h1>我的账户</h1><p class="sub">当前登录信息</p><dl class="profile"><dt>用户名</dt><dd id="username">—</dd><dt>显示名称</dt><dd id="displayName">—</dd><dt>所属域</dt><dd id="domain">—</dd><dt>角色</dt><dd id="role">—</dd><dt>有效期至</dt><dd id="expires">—</dd></dl><button id="logout" class="secondary" type="button">退出登录</button><p id="message" class="message"></p></main><script>
const token=sessionStorage.getItem('accountToken')||'',message=document.querySelector('#message');
async function load(){if(!token){location.replace('/login.html');return}try{const response=await fetch('/api/account/me',{headers:{Authorization:`Bearer ${token}`}}),user=await response.json().catch(()=>({}));if(!response.ok)throw new Error(user.message||'登录已失效');document.querySelector('#username').textContent=user.username;document.querySelector('#displayName').textContent=user.displayName||'—';document.querySelector('#domain').textContent=user.domain.domainName;document.querySelector('#role').textContent=user.role;document.querySelector('#expires').textContent=new Date(user.expiresAt).toLocaleString()}catch(error){sessionStorage.removeItem('accountToken');message.textContent=error.message;message.className='message error';setTimeout(()=>location.replace('/login.html'),1200)}}load();
document.querySelector('#logout').addEventListener('click',async()=>{try{await fetch('/api/account/logout',{method:'POST',headers:{Authorization:`Bearer ${token}`}})}finally{sessionStorage.removeItem('accountToken');location.replace('/login.html')}});
</script></body></html>
