<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>登录 - Ymforever WMS</title>
    <link rel="stylesheet" href="/account.css">
</head>
<body>
    <main class="account-shell">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true">Y</div>
            <h1>Ymforever WMS</h1>
            <p>幽梦之星管理平台</p>
        </header>
        <section class="account-card">
            <h2>登录账户</h2>
            <p class="intro">输入用户名和密码进入管理中心。</p>
            <form id="loginForm" class="form">
                <label class="field">
                    用户名
                    <input id="username" name="username" autocomplete="username" required autofocus>
                </label>
                <label class="field">
                    密码
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </label>
                <p id="message" class="message" role="alert"></p>
                <button id="submit" type="submit">登录</button>
            </form>
            <p class="switch">还没有账户？ <a href="/account/register">立即注册</a></p>
        </section>
        <div class="back"><a href="/">返回</a></div>
    </main>
    <script>
            const form=document.querySelector('#loginForm'),button=document.querySelector('#submit'),message=document.querySelector('#message'),username=document.querySelector('#username');
            const preset=new URLSearchParams(location.search).get('username');if(preset)username.value=preset;
            function show(text,type){message.textContent=text;message.className=`message show ${type}`}
            async function readError(response){const body=await response.json().catch(()=>({}));if(body.message)return body.message;if(body.errors)return Object.values(body.errors).flat().join(' ');return `请求失败（${response.status}）`}
            form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.className='message';try{const response=await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:document.querySelector('#password').value})});if(!response.ok)throw new Error(await readError(response));const account=await response.json();sessionStorage.setItem('account',JSON.stringify(account));show('登录成功，正在进入管理中心…','success');setTimeout(()=>location.href='/',500)}catch(error){show(error.message,'error')}finally{button.disabled=false}});
    </script>
</body>
</html>
