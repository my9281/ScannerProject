<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户登录</title><link rel="stylesheet" href="/account.css"></head><body><main class="card"><h1>用户登录</h1><p class="sub">登录 Web 用户系统</p><form id="form"><label class="field">用户名<input id="username" maxlength="100" autocomplete="username" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">登录</button></form><p id="message" class="message"></p><div class="links">没有账户？<a href="/register.html">注册</a></div></main><script>
const form=document.querySelector('#form'),message=document.querySelector('#message'),submit=document.querySelector('#submit');
form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;message.textContent='正在登录……';message.className='message';try{const response=await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value.trim(),password:document.querySelector('#password').value})}),result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.message||`登录失败（HTTP ${response.status}）`);sessionStorage.setItem('accountToken',result.token);location.href='/account.html'}catch(error){message.textContent=error.message;message.className='message error'}finally{submit.disabled=false}});
</script></body></html>
