<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户登录 · 维修管理平台</title><link rel="icon" href="/shipping-cow-icon.png"><link rel="stylesheet" href="/shipping-cow.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/workspace.css?v=3">
<script src="/workspace.js?v=3" defer></script>
</head><body class="workspace workspace-auth">
<div class="workspace-layout">
<aside class="workspace-menu" aria-label="侧边栏"></aside>
<main class="workspace-content card auth-card"><a class="cow-brand" href="/"><img src="/shipping-cow-icon.png" width="145" height="138" alt=""><span>维修管理平台<small>ShippingCow</small></span></a><h1>用户登录</h1><p>登录后，最近一次使用起 7 天内可继续访问。</p><form id="form"><label class="field">用户名<input id="username" maxlength="100" autocomplete="username" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">登录</button></form><p id="message" class="message" role="status" aria-live="polite"></p><div class="links"><a href="/">返回首页</a></div></main>
</div><script>
const form=document.querySelector('#form'),message=document.querySelector('#message'),submit=document.querySelector('#submit');
form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;message.textContent='正在登录……';message.className='message';try{const response=await fetch('/api/account/web-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value.trim(),password:document.querySelector('#password').value})}),result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.message||Object.values(result.errors||{}).flat().join(' ')||`登录失败（HTTP ${response.status}）`);location.href='/account.html'}catch(error){message.textContent=error.message;message.className='message error'}finally{submit.disabled=false}});
</script></body></html>
