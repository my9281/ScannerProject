<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户注册</title><link rel="stylesheet" href="/account.css"></head><body><main class="card"><h1>创建账户</h1><p class="sub">注册 Web 用户</p><form id="form"><label class="field">用户名<input id="username" minlength="3" maxlength="100" autocomplete="username" required></label><label class="field">所属域<select id="domain" required><option value="">正在加载……</option></select></label><label class="field">密码<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">确认密码<input id="confirm" type="password" minlength="6" autocomplete="new-password" required></label><button id="submit" type="submit">注册</button></form><p id="message" class="message"></p><div class="links">已有账户？<a href="/login.html">登录</a></div></main><script>
const form=document.querySelector('#form'),message=document.querySelector('#message'),submit=document.querySelector('#submit'),domain=document.querySelector('#domain');
async function domains(){try{const response=await fetch('/api/account/domains'),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'无法读取用户域');domain.innerHTML=data.map(x=>`<option value="${x.id}">${String(x.domainName).replace(/[&<>"']/g,'')}</option>`).join('')}catch(error){domain.innerHTML='<option value="">加载失败</option>';message.textContent=error.message;message.className='message error'}}domains();
form.addEventListener('submit',async event=>{event.preventDefault();const password=document.querySelector('#password').value,confirmPassword=document.querySelector('#confirm').value;if(password!==confirmPassword){message.textContent='两次输入的密码不一致。';message.className='message error';return}submit.disabled=true;message.textContent='正在注册……';message.className='message';try{const response=await fetch('/api/account/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value.trim(),password,confirmPassword,domainId:Number(domain.value)})}),result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.message||`注册失败（HTTP ${response.status}）`);sessionStorage.setItem('accountToken',result.token);location.href='/account.html'}catch(error){message.textContent=error.message;message.className='message error'}finally{submit.disabled=false}});
</script></body></html>
