<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件管理中心</title>
  <style>
    :root{font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{width:min(1100px,calc(100% - 32px));margin:40px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}h1{margin:0;font-size:30px}.sub{color:#68748a;margin:7px 0 0}.card{background:#fff;border:1px solid #dfe6f0;border-radius:16px;box-shadow:0 10px 32px #1720330d}.upload{padding:22px;display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}.field{display:grid;gap:7px;font-size:14px;color:#4c586e}input,button{font:inherit;padding:11px 13px;border-radius:9px;border:1px solid #ccd5e3}button{background:#255ed8;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.message{min-height:24px;margin:12px 3px;color:#18714b}.error{color:#b02b2b}.files{overflow:hidden}.toolbar{padding:17px 20px;border-bottom:1px solid #e6ebf2;display:flex;justify-content:space-between;align-items:center}.toolbar h2{font-size:18px;margin:0}.link{background:transparent;color:#255ed8;padding:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 20px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{font-size:13px;color:#6b768a;background:#fafbfd}td:first-child{white-space:normal;max-width:480px;word-break:break-all}.actions{display:flex;gap:7px}.small{font-size:13px;padding:7px 11px}.empty{text-align:center!important;color:#7a8496;padding:44px!important}.order-card{padding:22px;margin-bottom:22px}.order-card h2{margin:0 0 16px;font-size:20px}.order-form{display:grid;grid-template-columns:90px repeat(2,1fr);gap:14px}.order-form .wide{grid-column:span 2}.order-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}.danger{background:#b42318}.secondary{background:#596579}.order-result{margin:15px 0 0;padding:14px;background:#f5f8fc;border-radius:9px;white-space:pre-wrap;word-break:break-word}.order-result:empty{display:none}.modal{position:fixed;inset:0;background:#17203399;display:grid;place-items:center;padding:24px}.modal[hidden]{display:none}.dialog{width:min(900px,100%);max-height:85vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden}.dialog-head{padding:16px 20px;border-bottom:1px solid #e5eaf1;display:flex;justify-content:space-between;align-items:center}.dialog-head h3{margin:0;font-size:17px;word-break:break-all}.close{background:transparent;color:#4b566a;font-size:22px;padding:2px 8px}pre{margin:0;padding:20px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:14px/1.65 Consolas,monospace}.json-key{color:#7c3aed}.json-string{color:#087f5b}.json-number{color:#c2410c}.json-boolean{color:#2563eb}.json-null{color:#6b7280}@media(max-width:760px){.shell{margin:24px auto}.head{align-items:start;flex-direction:column}.upload,.order-form{grid-template-columns:1fr}.order-form .wide{grid-column:auto}.upload button{width:100%}th:nth-child(3),td:nth-child(3){display:none}th,td{padding:12px}.actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head"><div><h1>Repair WMS 管理中心</h1><p class="sub">订单管理及扫描文件管理</p></div></header>
    <section class="card order-card">
      <h2>Orders 增删改查</h2>
      <div class="order-form">
        <label class="field">ID<input id="orderId" type="number" min="1" placeholder="查询、修改或删除时填写"></label>
        <label class="field">类型 dtype<input id="dtype" maxlength="50"></label>
        <label class="field">SN<input id="sn" maxlength="50"></label>
        <label class="field">OID doid<input id="doid" maxlength="50"></label>
        <label class="field">时间 dtime<input id="dtime" type="datetime-local" step="1"></label>
        <label class="field wide">备注 dnote<input id="dnote" maxlength="50"></label>
        <div class="order-actions"><button id="createOrder" type="button">增加</button><button id="queryOrder" class="secondary" type="button">按 ID 查询</button><button id="updateOrder" type="button">按 ID 修改</button><button id="deleteOrder" class="danger" type="button">按 ID 删除</button><button id="clearOrder" class="secondary" type="button">清空</button></div>
      </div>
      <pre id="orderResult" class="order-result"></pre>
    </section>
    <section class="card upload">
      <label class="field">访问密钥<input id="apiKey" type="password" autocomplete="current-password" placeholder="未配置时留空"></label>
      <label class="field">选择文件<input id="file" type="file" accept=".txt,.json,text/plain,application/json" required></label>
      <button id="submit" type="button">上传文件</button>
    </section>
    <p id="message" class="message"></p>
    <section class="card files">
      <div class="toolbar"><h2>已上传文件</h2><button id="refresh" class="link" type="button">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>上传时间</th><th>操作</th></tr></thead><tbody id="fileList"></tbody></table></div>
    </section>
  </main>
  <div id="modal" class="modal" hidden><section class="dialog"><header class="dialog-head"><h3 id="previewName"></h3><button id="close" class="close" type="button" aria-label="关闭">×</button></header><pre id="preview"></pre></section></div>
  <script>
    const $=selector=>document.querySelector(selector);const apiKey=$('#apiKey'),fileInput=$('#file'),message=$('#message'),list=$('#fileList'),submit=$('#submit'),modal=$('#modal'),preview=$('#preview'),orderResult=$('#orderResult');
    apiKey.value=sessionStorage.getItem('uploadApiKey')||'';apiKey.addEventListener('change',()=>{sessionStorage.setItem('uploadApiKey',apiKey.value);loadFiles()});
    const headers=()=>({'X-Upload-Key':apiKey.value});const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const formatSize=bytes=>bytes<1024?`${bytes} B`:bytes<1048576?`${(bytes/1024).toFixed(1)} KB`:`${(bytes/1048576).toFixed(1)} MB`;
    async function readBody(response){const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.message||`请求失败（${response.status}）`);return body}
    const orderId=()=>{const id=Number($('#orderId').value);if(!Number.isInteger(id)||id<1)throw new Error('请输入有效的订单 ID。');return id};
    const orderBody=()=>({dtype:$('#dtype').value.trim(),sn:$('#sn').value.trim(),doid:$('#doid').value.trim(),dtime:$('#dtime').value,dnote:$('#dnote').value.trim()});
    const showOrder=(value,isError=false)=>{orderResult.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);orderResult.className=`order-result${isError?' error':''}`};
    const fillOrder=order=>{$('#orderId').value=order.id;$('#dtype').value=order.dtype;$('#sn').value=order.sn;$('#doid').value=order.doid;$('#dtime').value=String(order.dtime).slice(0,19);$('#dnote').value=order.dnote;showOrder(order)};
    async function orderRequest(url,options={}){options.headers={...headers(),...(options.body?{'Content-Type':'application/json'}:{})};return readBody(await fetch(url,options))}
    $('#createOrder').addEventListener('click',async()=>{try{const created=await orderRequest('/api/orders',{method:'POST',body:JSON.stringify(orderBody())});fillOrder(created);showOrder(`增加成功\n${JSON.stringify(created,null,2)}`)}catch(error){showOrder(error.message,true)}});
    $('#queryOrder').addEventListener('click',async()=>{try{fillOrder(await orderRequest(`/api/orders/${orderId()}`))}catch(error){showOrder(error.message,true)}});
    $('#updateOrder').addEventListener('click',async()=>{try{const id=orderId(),result=await orderRequest(`/api/orders/${id}`,{method:'PUT',body:JSON.stringify(orderBody())});showOrder(result)}catch(error){showOrder(error.message,true)}});
    $('#deleteOrder').addEventListener('click',async()=>{try{const id=orderId();if(!confirm(`确定删除订单 ${id}？`))return;showOrder(await orderRequest(`/api/orders/${id}`,{method:'DELETE'}))}catch(error){showOrder(error.message,true)}});
    $('#clearOrder').addEventListener('click',()=>{['orderId','dtype','sn','doid','dtime','dnote'].forEach(id=>document.getElementById(id).value='');orderResult.textContent=''});
    async function loadFiles(){list.innerHTML='<tr><td colspan="5" class="empty">正在加载…</td></tr>';try{const files=await readBody(await fetch('/api/uploads',{headers:headers()}));list.innerHTML=files.length?files.map(file=>`<tr><td>${escapeHtml(file.fileName)}</td><td>${file.type}</td><td>${formatSize(file.size)}</td><td>${new Date(file.uploadedAtUtc).toLocaleString()}</td><td><div class="actions"><button class="small" data-view="${file.id}">查看</button><button class="small" data-download="${file.id}" data-name="${escapeHtml(file.fileName)}">下载</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">还没有上传文件</td></tr>'}catch(error){list.innerHTML=`<tr><td colspan="5" class="empty error">${escapeHtml(error.message)}</td></tr>`}}
    submit.addEventListener('click',async()=>{const file=fileInput.files[0];if(!file){showMessage('请选择 TXT 或 JSON 文件。',true);return}submit.disabled=true;showMessage('正在上传…');const data=new FormData();data.append('file',file);data.append('deviceName','web');try{const body=await readBody(await fetch('/api/uploads/scans',{method:'POST',headers:headers(),body:data}));showMessage(body.message);fileInput.value='';await loadFiles()}catch(error){showMessage(error.message,true)}finally{submit.disabled=false}});
    list.addEventListener('click',async event=>{const view=event.target.closest('[data-view]'),download=event.target.closest('[data-download]');if(view){try{const body=await readBody(await fetch(`/api/uploads/${encodeURIComponent(view.dataset.view)}/content`,{headers:headers()}));$('#previewName').textContent=body.fileName;preview.textContent=body.type==='json'?JSON.stringify(JSON.parse(body.content),null,2):body.content;modal.hidden=false}catch(error){showMessage(error.message,true)}}if(download){try{const response=await fetch(`/api/uploads/${encodeURIComponent(download.dataset.download)}/download`,{headers:headers()});if(!response.ok){await readBody(response);return}const url=URL.createObjectURL(await response.blob()),anchor=document.createElement('a');anchor.href=url;anchor.download=download.dataset.name;anchor.click();URL.revokeObjectURL(url)}catch(error){showMessage(error.message,true)}}});
    function showMessage(text,isError=false){message.textContent=text;message.className=`message${isError?' error':''}`}
    $('#refresh').addEventListener('click',loadFiles);$('#close').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',event=>{if(event.target===modal)modal.hidden=true});document.addEventListener('keydown',event=>{if(event.key==='Escape')modal.hidden=true});loadFiles();
  </script>
</body>
</html>
